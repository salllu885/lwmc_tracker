name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SYNTHETIC_EMAIL_DOMAIN: ${{ secrets.VITE_SYNTHETIC_EMAIL_DOMAIN }}
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      # @capacitor/geolocation ships an EMPTY AndroidManifest.xml (unlike
      # Camera, which delegates to the device's own camera app and needs no
      # permission at all) — it relies on the host app to declare location
      # permissions itself. android/ isn't committed to this repo (it's
      # regenerated fresh every build), so that declaration has to be
      # injected here, right after cap generates the template, or the app
      # never even shows a Location toggle in Android's permission settings.
      - name: Add location permissions to Android manifest
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' android/app/src/main/AndroidManifest.xml
          grep -A2 'permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: field-issue-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
